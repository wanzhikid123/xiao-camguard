[platformio]
default_envs = xiao-baseline
src_dir = .
core_dir = .tools/platformio

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions/xiao_8mb_ota.csv
build_flags =
    -I .
    -I src
    -DBOARD_HAS_PSRAM
build_src_filter =
    +<ESP32-CAM_MJPEG2SD.ino>
    +<ESP32-CAM_MJPEG2SD.ino.cpp>
    +<src/*.cpp>

[env:xiao-baseline]
extra_scripts =
    post:scripts/esptool_module.py
    post:scripts/ota_budget.py

[env:xiao-audio-baseline]
extends = env:xiao-baseline
build_flags =
    ${env.build_flags}
    -DXIAO_AUDIO_BASELINE

[env:xiao-minimal]
extends = env:xiao-audio-baseline
build_flags =
    ${env:xiao-audio-baseline.build_flags}
    -DXIAO_MINIMAL

[env:xiao-appliance]
extends = env:xiao-minimal
lib_deps = symlink://vendor/wireguard-idf5
build_flags =
    ${env:xiao-minimal.build_flags}
    -DXIAO_APPLIANCE
    -Wl,--wrap=ip4_route_src_hook
    -Wl,--wrap=etharp_output
    -Wl,--wrap=ethip6_output
    -Wl,--wrap=nimble_mem_malloc
    -Wl,--wrap=nimble_mem_calloc
    -Wl,--wrap=nimble_mem_free
    -Wl,--wrap=esp_mbedtls_mem_calloc
extra_scripts =
    pre:scripts/embed_ui.py
    pre:scripts/media_codec_paths.py
    post:scripts/media_codecs.py
    ${env:xiao-baseline.extra_scripts}

# Hardware codec fixture. Only explicitly allowlisted test AVI may be converted/deleted. Never ship.
[env:xiao-appliance-codec-test]
extends = env:xiao-appliance
build_flags =
    ${env:xiao-appliance.build_flags}
    -DXIAO_APPLIANCE_CODEC_TEST

# Explicit hardware fixture. Never ship: RAM-only synthetic verifier, no camcfg writes.
[env:xiao-appliance-auth-test]
extends = env:xiao-appliance
build_flags =
    ${env:xiao-appliance.build_flags}
    -DXIAO_APPLIANCE_AUTH_TEST

# Explicit boot-health rejection fixture: install only to test SDK fallback.
[env:xiao-appliance-ota-rollback-test]
extends = env:xiao-appliance
build_flags =
    ${env:xiao-appliance.build_flags}
    -DXIAO_APPLIANCE_OTA_ROLLBACK_TEST

# Explicit non-release fault fixture. Does not initialize or modify the SD.
[env:xiao-appliance-sd-absent-test]
extends = env:xiao-appliance
build_flags =
    ${env:xiao-appliance.build_flags}
    -DXIAO_APPLIANCE_SD_ABSENT_TEST

# Hardware-only TCP teardown regression fixture. Never ship this environment.
[env:xiao-appliance-wg-teardown-test]
extends = env:xiao-appliance
build_flags =
    ${env:xiao-appliance.build_flags}
    -DXIAO_APPLIANCE_WG_TEARDOWN_TEST

# Explicit RAM-only full-route/output-guard spike. Never ship this environment.
[env:xiao-appliance-full-tunnel-test]
extends = env:xiao-appliance
build_flags =
    ${env:xiao-appliance.build_flags}
    -DXIAO_APPLIANCE_FULL_TUNNEL_TEST

# Explicit production-policy fault injection and cold-clock fixture. Never ship.
[env:xiao-appliance-full-policy-test]
extends = env:xiao-appliance
build_flags =
    ${env:xiao-appliance.build_flags}
    -DXIAO_APPLIANCE_FULL_POLICY_TEST

# RAM-only detector scene fixture; never install as the final product image.
[env:xiao-appliance-event-test]
extends = env:xiao-appliance
build_flags =
    ${env:xiao-appliance.build_flags}
    -DXIAO_APPLIANCE_EVENT_TEST

# Combined, exact-source event/conversion regression fixture. Never ship.
[env:xiao-appliance-event-codec-test]
extends = env:xiao-appliance-event-test
build_flags =
    ${env:xiao-appliance-event-test.build_flags}
    -DXIAO_APPLIANCE_CODEC_TEST
