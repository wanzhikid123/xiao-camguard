[platformio]
default_envs = released
core_dir = ../../.tools/platformio

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = ../../partitions/xiao_8mb_ota.csv
build_flags = -DBOARD_HAS_PSRAM
extra_scripts = post:../../scripts/esptool_module.py

[env:released]
lib_deps = https://github.com/ciniml/WireGuard-ESP32-Arduino.git#a3307979bb5bfe4e767a9331f06cf1bc05136b1b

[env:main-snapshot]
lib_deps = https://github.com/ciniml/WireGuard-ESP32-Arduino.git#3048281829d14a3050faa19cfbe47146e33c0765

[env:pr52]
lib_deps = https://github.com/lumapu/WireGuard-ESP32-Arduino.git#48f970462237eae678c29b62553afaf2e520bad4

[env:pr52-idf5]
lib_deps = symlink://../../vendor/wireguard-idf5
build_flags = ${env.build_flags} -DWG_IDF5_SPIKE -DCORE_DEBUG_LEVEL=0

; Compile the public example even when this checkout has private credentials.
[env:pr52-idf5-example]
extends = env:pr52-idf5
build_flags = ${env:pr52-idf5.build_flags} -DWG_NO_LOCAL_SECRETS
