[platformio]
default_envs = diagnostics
core_dir = ../../.tools/platformio

[env:diagnostics]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 8MB
board_build.partitions = ../../partitions/xiao_8mb_ota.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
extra_scripts = post:../../scripts/esptool_module.py
build_src_filter = +<main.cpp>

; Explicit one-use utility. Requires a USB command and checks the target MAC
; plus the previously observed exFAT volume before writing any card sector.
[env:format-empty-sd]
extends = env:diagnostics
build_src_filter = +<format_sd.cpp>

[env:seed-assets]
extends = env:diagnostics
build_src_filter = +<seed_assets.cpp>
extra_scripts =
    pre:generate_seed_assets.py
    post:../../scripts/esptool_module.py

; Tests only owned cfgtest* namespaces, with synthetic credentials and explicit
; USB start. Does not alter the upstream or product configuration namespaces.
[env:config-nvs]
extends = env:diagnostics
lib_deps = symlink://../../lib/appliance-config
build_src_filter = +<config_nvs.cpp>

; Parser/password/session module checks; synthetic input, no NVS/card writes.
[env:config-auth]
extends = env:diagnostics
lib_deps = symlink://../../lib/appliance-config
build_src_filter = +<config_auth.cpp>

[env:auth-http]
extends = env:diagnostics
lib_deps = symlink://../../lib/appliance-config
build_src_filter = +<auth_http.cpp>

; Real Wi-Fi trial/rollback, only owned nettrial* NVS; secrets supplied by USB.
[env:network-trial]
extends = env:diagnostics
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
lib_deps = symlink://../../lib/appliance-config
build_src_filter = +<network_trial.cpp>
